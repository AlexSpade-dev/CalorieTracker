<!DOCTYPE html><html class="h-full bg-[#07091e]" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Sign Up - CalorieTracker+</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Font Awesome Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            abyss: {
              DEFAULT: '#07091e',
              surface: '#0d1138',
              card: '#111742',
              cardActive: '#121d52',
              border: '#1a2456',
              accent: '#0094c6',
              accentLight: '#38bdf8',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* Custom radio appearance & glow effects */
    .glow-cyan {
      box-shadow: 0 0 15px rgba(0, 148, 198, 0.35);
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
    .custom-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-full bg-[#07091e] text-slate-100 font-sans antialiased selection:bg-[#0094c6] selection:text-white">
<!-- BEGIN: MobileDeviceContainer -->
<main class="min-h-screen max-w-md mx-auto px-5 pt-8 pb-10 flex flex-col justify-between custom-scroll">
<!-- Top Header Navigation & Step Indicator -->
<div>
<!-- BEGIN: TopBar -->
<header class="flex items-center justify-between mb-6">
<!-- Back Button -->
<button aria-label="Go Back" class="w-10 h-10 rounded-full bg-[#131b47]/80 border border-[#202b66] flex items-center justify-center text-slate-300 hover:text-white transition-colors" type="button">
<i class="fa-solid fa-arrow-left text-sm"></i>
</button>
<!-- Step Pill Badge -->
<div class="flex items-center gap-2 bg-[#121946]/90 border border-[#232e6d] rounded-full px-3.5 py-1.5 shadow-inner"><div class="flex items-center gap-1.5"><span class="w-4 h-1.5 bg-[#0094c6] rounded-full inline-block shadow-[0_0_8px_#0094c6]"></span><span class="w-4 h-1.5 bg-slate-700/60 rounded-full inline-block"></span></div><span class="text-xs font-medium text-slate-200">Step 1 of 2: Profile &amp; Goals</span></div>
<!-- Bolt / Flash Action Icon -->
<button aria-label="Quick Actions" class="w-10 h-10 flex items-center justify-center text-[#0094c6] hover:text-[#38bdf8] transition-colors" type="button">
<i class="fa-solid fa-bolt text-lg"></i>
</button>
</header>
<!-- END: TopBar -->
<!-- BEGIN: HeroSection -->
<section class="mb-6">
<!-- Brand Capsule -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full border border-[#202d6b] bg-[#121844]/60 text-[#38bdf8] text-xs font-semibold tracking-wide mb-3">
<span class="">CalorieTracker+</span>
</div>
<!-- Main Title & Subtitle -->
<h1 class="text-3xl font-extrabold text-white tracking-tight leading-tight">Start Your Health Journey</h1>
<p class="text-slate-400 text-sm mt-1.5">Join 50,000+ members tracking nutrition daily</p>
</section>
<!-- END: HeroSection -->
<!-- BEGIN: RegistrationForm -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div data-purpose="input-group">
<div class="flex justify-between items-center text-xs font-medium mb-1.5">
<label class="text-slate-200" for="fullName">Full Name</label>
<span class="text-slate-400">Required</span>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
<i class="fa-regular fa-user text-sm"></i>
</span>
<input class="w-full bg-[#0d1238] border border-[#1b255e] focus:border-[#0094c6] focus:ring-1 focus:ring-[#0094c6] rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition-all" id="fullName" placeholder="e.g. Alex Morgan" type="text">
</div>
</div>
<!-- Email Address Field -->
<div data-purpose="input-group">
<div class="flex justify-between items-center text-xs font-medium mb-1.5">
<label class="text-slate-200" for="email">Email Address</label>
<span class="text-slate-400">Verification link will be sent</span>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
<i class="fa-regular fa-envelope text-sm"></i>
</span>
<input class="w-full bg-[#0d1238] border border-[#1b255e] focus:border-[#0094c6] focus:ring-1 focus:ring-[#0094c6] rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition-all" id="email" placeholder="alex@example.com" type="email">
</div>
</div>
<!-- Password Field -->
<div data-purpose="input-group">
<div class="flex justify-between items-center text-xs font-medium mb-1.5">
<label class="text-slate-200" for="password">Password</label>
<span class="text-[#0094c6] font-semibold">Strong</span>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
<i class="fa-solid fa-key text-sm"></i>
</span>
<input class="w-full bg-[#0d1238] border border-[#1b255e] focus:border-[#0094c6] focus:ring-1 focus:ring-[#0094c6] rounded-xl pl-10 pr-10 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition-all" id="password" placeholder="Create a strong password" type="password">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200" type="button">
<i class="fa-regular fa-eye text-sm"></i>
</button>
</div>
<!-- Password Strength Indicators -->
<div class="mt-2.5 space-y-1.5">
<div class="grid grid-cols-4 gap-1.5">
<div class="h-1 rounded-full bg-[#0094c6]"></div>
<div class="h-1 rounded-full bg-[#0094c6]"></div>
<div class="h-1 rounded-full bg-[#0094c6]"></div>
<div class="h-1 rounded-full bg-[#0094c6]/40"></div>
</div>
<p class="text-[11px] text-slate-400 font-normal">Includes numbers, symbols, and uppercase letters</p>
</div>
</div>
<!-- BEGIN: CalorieGoalSection -->
<div class="pt-2" data-purpose="calorie-goals-selector">
<div class="flex justify-between items-center mb-2.5">
<span class="text-sm font-medium text-slate-200">Daily Calorie Goal</span>
<span class="text-xs text-slate-500">Can be changed later</span>
</div>
<!-- Radio Option Cards -->
<div class="space-y-2.5">
<!-- Option 1: Deficit -->
<label class="flex items-center justify-between p-3.5 rounded-xl border border-[#1b255e] bg-[#0d1238]/80 cursor-pointer hover:border-[#2b3a88] transition-all">
<div class="flex items-center gap-3">
<input class="w-4 h-4 text-[#0094c6] bg-transparent border-slate-600 focus:ring-[#0094c6] focus:ring-offset-0 focus:ring-0" name="calorie_goal" type="radio" value="deficit">
<div>
<div class="flex items-center gap-2">
<span class="text-sm font-semibold text-white">1,800 kcal</span>
<span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-blue-950/70 text-cyan-400 border border-cyan-900/50">Deficit</span>
</div>
<p class="text-xs text-slate-400">Fat Loss &amp; Lean Conditioning</p>
</div>
</div>
<i class="fa-solid fa-fire text-slate-500 text-base"></i>
</label>
<!-- Option 2: Optimal (Selected by default) -->
<label class="flex items-center justify-between p-3.5 rounded-xl border-2 border-[#0094c6] bg-[#111947] glow-cyan cursor-pointer transition-all">
<div class="flex items-center gap-3">
<input checked="" class="w-4 h-4 text-[#0094c6] bg-transparent border-[#0094c6] focus:ring-[#0094c6] focus:ring-offset-0 focus:ring-0" name="calorie_goal" type="radio" value="optimal">
<div>
<div class="flex items-center gap-2">
<span class="text-sm font-semibold text-white">2,200 kcal</span>
<span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-[#0094c6]/20 text-[#38bdf8] border border-[#0094c6]/40">Optimal</span>
</div>
<p class="text-xs text-slate-300">Maintenance &amp; Daily Energy</p>
</div>
</div>
<i class="fa-solid fa-scale-balanced text-[#0094c6] text-base"></i>
</label>
<!-- Option 3: Surplus -->
<label class="flex items-center justify-between p-3.5 rounded-xl border border-[#1b255e] bg-[#0d1238]/80 cursor-pointer hover:border-[#2b3a88] transition-all">
<div class="flex items-center gap-3">
<input class="w-4 h-4 text-[#0094c6] bg-transparent border-slate-600 focus:ring-[#0094c6] focus:ring-offset-0 focus:ring-0" name="calorie_goal" type="radio" value="surplus">
<div>
<div class="flex items-center gap-2">
<span class="text-sm font-semibold text-white">2,600 kcal</span>
<span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-blue-950/70 text-cyan-400 border border-cyan-900/50">Surplus</span>
</div>
<p class="text-xs text-slate-400">Muscle Gain &amp; Hypertrophy</p>
</div>
</div>
<i class="fa-solid fa-arrows-up-down-left-right text-slate-500 text-base"></i>
</label>
</div>
</div>
<!-- END: CalorieGoalSection -->
<!-- Terms and Privacy Checkbox -->
<div class="flex items-start gap-2.5 pt-2">
<input class="mt-1 w-4 h-4 rounded border-slate-600 bg-[#0d1238] text-[#0094c6] focus:ring-[#0094c6] focus:ring-offset-0" id="terms" type="checkbox">
<label class="text-xs text-slate-400 leading-relaxed select-none" for="terms">
            I agree to the <a class="text-slate-200 underline decoration-slate-500 hover:text-white" href="#">Terms of Service</a> and acknowledge the <a class="text-slate-200 underline decoration-slate-500 hover:text-white" href="#">Privacy Policy</a>.
          </label>
</div>
<!-- Submit Button -->
<button class="w-full mt-4 py-3.5 px-4 rounded-xl bg-[#0094c6] hover:bg-[#0081ad] active:scale-[0.99] text-white font-semibold flex items-center justify-center gap-2 shadow-lg shadow-[#0094c6]/25 transition-all text-sm" type="submit">
<span class="">Next</span>
<i class="fa-solid fa-arrow-right text-xs"></i>
</button>
</form>
<!-- END: RegistrationForm -->
</div>
<!-- BEGIN: FooterSignIn -->
<footer class="mt-8 text-center text-xs text-slate-400 pb-2">
      Already have an account? 
      <a class="text-[#0094c6] hover:text-[#38bdf8] font-medium ml-1" href="#">Sign In</a>
</footer>
<!-- END: FooterSignIn -->
</main>
<!-- END: MobileDeviceContainer -->




</body></html>
