<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CalorieTracker+ - Dialog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#0d0f32',
            surface: '#0d0f32',
            'surface-container-lowest': '#080a2c',
            'surface-container-low': '#16183a',
            'surface-container': '#1a1c3e',
            'surface-container-high': '#242749',
            primary: '#79d1ff',
            'primary-container': '#1a9bcd',
            secondary: '#8ccff2',
            'secondary-container': '#015e7c',
            outline: '#88929a',
            'outline-variant': '#3e484f',
            'on-surface': '#e0e0ff',
            'on-surface-variant': '#bec8d0',
            'on-primary': '#003549',
            'on-primary-container': '#002d40',
            error: '#ffb4ab'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>
<body class="bg-surface-container-lowest text-on-surface antialiased min-h-screen flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-background/80 backdrop-blur-md"></div>
  <main class="relative w-full max-w-md rounded-[28px] border border-outline-variant/40 bg-surface-container shadow-2xl overflow-hidden">
      <div class="p-6 sm:p-7">
    <div class="flex items-center justify-between mb-6">
      <div>
        <p class="text-label-sm uppercase tracking-[0.14em] text-on-surface-variant">Security</p>
        <h2 class="mt-1 text-headline-sm font-bold text-on-surface">Reset Password</h2>
      </div>
      <button class="text-on-surface-variant hover:text-on-surface" type="button" aria-label="Close dialog" onclick="window.location.href='../Log-In.html'">
        <span class="material-symbols-outlined text-3xl">close</span>
      </button>
    </div>

    <div id="reset-form-panel">
      <label class="block mb-5">
        <span class="mb-2 block text-body-sm text-on-surface-variant">Email address</span>
        <input id="reset-email" type="email" class="w-full rounded-2xl border border-outline-variant/40 bg-surface-container-low px-3 py-3 text-body-md text-on-surface focus:border-primary focus:outline-none" placeholder="you@example.com" />
      </label>

      <div id="reset-error" class="hidden mb-4 rounded-xl border border-error/40 bg-error/10 px-3 py-2 text-body-sm text-error">
        Please enter a valid email address.
      </div>

      <button id="send-reset" class="w-full rounded-full bg-primary-container hover:bg-primary text-on-primary-container font-bold py-3.5 transition-all hover:brightness-110 active:scale-[0.98]">
        Send reset link
      </button>
    </div>

    <div id="reset-success" class="hidden rounded-2xl border border-primary/30 bg-primary/10 p-4 text-center">
      <p class="text-headline-sm font-bold text-primary">Link sent</p>
      <p class="mt-2 text-body-md text-on-surface-variant">A password reset link was sent to alex@example.com. Check your inbox for the next steps.</p>
      <button type="button" onclick="window.location.href='../Log-In.html'" class="mt-4 w-full rounded-full bg-primary-container hover:bg-primary text-on-primary-container font-bold py-3.5 transition-all">
        Back to sign in
      </button>
    </div>
  </div>
  <script>
    const resetEmail = document.getElementById('reset-email');
    const resetError = document.getElementById('reset-error');
    const resetFormPanel = document.getElementById('reset-form-panel');
    const resetSuccess = document.getElementById('reset-success');
    const sendReset = document.getElementById('send-reset');

    sendReset && sendReset.addEventListener('click', () => {
      const email = resetEmail.value.trim();
      if (!email || !email.includes('@')) {
        resetError.classList.remove('hidden');
        return;
      }
      resetError.classList.add('hidden');
      resetFormPanel.classList.add('hidden');
      resetSuccess.classList.remove('hidden');
    });
  </script>
  </main>
<script src="../../assets/mobile.js"></script>
</body>
</html>
